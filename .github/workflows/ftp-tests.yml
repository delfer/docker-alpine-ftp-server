name: FTP test-only checks
on:
  push:
    paths:
      - 'tests/**'
      - '.github/workflows/**'
  workflow_dispatch:
  schedule:
    - cron: '19 3 * * *'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image under test
        run: docker build --tag ftp-under-test:local .

      - name: Pull test client
        run: docker pull python:3.12-alpine

      - name: Run FTP integration tests
        run: python3 tests/run.py --image ftp-under-test:local

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ftp-test-results
          path: test-results/
          if-no-files-found: warn
